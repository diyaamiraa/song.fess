<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Fess Interactive App</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .image-container {
            margin: 20px 0;
            text-align: center;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .dynamic-img {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .nav-menu {
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 35px;
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 10;
        }

        .menu-btn {
            background: transparent;
            color: #b3b3b3;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            color: #ffffff;
        }

        .menu-btn.active {
            background: #1db954;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        .page-content {
            width: 100%;
            max-width: 520px;
            display: none;
            animation: fadeIn 0.4s ease;
            position: relative;
            z-index: 5;
        }

        .page-content.visible {
            display: block;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #1db954;
        }

        .fess-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1db954;
            text-transform: uppercase;
        }

        .input-group input, .input-group textarea {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            color: #ffffff;
            outline: none;
            font-size: 0.95rem;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: #1db954;
        }

        .btn-submit {
            background: #1db954;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover { background: #1ed760; }

        .message-wall {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bubble {
            background: rgba(255, 255, 255, 0.08);
            border-left: 5px solid #1db954;
            padding: 18px;
            border-radius: 0 15px 15px 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .bubble-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #1db954;
            margin-bottom: 6px;
            font-weight: bold;
            padding-right: 25px;
        }

        .bubble-song {
            background: rgba(29, 185, 84, 0.15);
            color: #1ed760;
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .btn-delete {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #ff4d4d;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-delete:hover {
            transform: scale(1.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <script>
        const statusImage = document.getElementById('statusImage');
        const pageKirim = document.getElementById('pageKirim');
        const pageLihat = document.getElementById('pageLihat');
        const btnKirim = document.getElementById('btnKirim');
        const btnLihat = document.getElementById('btnLihat');
        const form = document.getElementById('songfessForm');

        // DAFTAR ALAMAT URL GAMBAR ASLI ANDA
        const imgHi = "https://phototourl.com"; 
        const imgCat = "https://unsplash.com"; 
        const imgMinion = "https://phototourl.com"; 

        statusImage.src = imgHi;

        function switchPage(target) {
            btnKirim.classList.remove('active');
            btnLihat.classList.remove('active');
            pageKirim.classList.remove('visible');
            pageLihat.classList.remove('visible');

            if (target === 'kirim') {
                pageKirim.classList.add('visible');
                btnKirim.classList.add('active');
                statusImage.src = imgCat; 
            } else if (target === 'lihat') {
                pageLihat.classList.add('visible');
                btnLihat.classList.add('active');
                displayMessages();
            }
        }

        function displayMessages() {
            const messageWall = document.getElementById('messageWall');
            messageWall.innerHTML = '';
            const messages = JSON.parse(localStorage.getItem('songfess_data')) || [];
            if(messages.length === 0) {
                messageWall.innerHTML = '<p style="text-align:center; color:#888; font-size: 0.9rem;">Belum ada pesan fess masuk.</p>';
                return;
            }

            messages.slice().reverse().forEach((data, index) => {
                const originalIndex = messages.length - 1 - index; 
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerHTML = `
                    <button class="btn-delete" onclick="deleteMessage(${originalIndex})" title="Hapus pesan saya">🗑️</button>
                    <div class="bubble-meta">
                        <span>Dari: ${escapeHTML(data.from)}</span>
                        <span>Untuk: ${escapeHTML(data.to)}</span>
                    </div>
                    <div class="bubble-song">🎵 ${escapeHTML(data.song)}</div>
                    <p style="color:#e0e0e0; font-size:0.95rem; line-height:1.4; word-wrap:break-word;">${escapeHTML(data.message)}</p>
                `;
                messageWall.appendChild(bubble);
            });
        }

        function deleteMessage(index) {
            if (confirm("Apakah Anda yakin ingin menghapus bubble pesan ini?")) {
                let currentMessages = JSON.parse(localStorage.getItem('songfess_data')) || [];
                currentMessages.splice(index, 1);
                localStorage.setItem('songfess_data', JSON.stringify(currentMessages));
                displayMessages();
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const fromVal = document.getElementById('from').value;
            const toVal = document.getElementById('to').value;
            const songVal = document.getElementById('song').value;
            const messageVal = document.getElementById('message').value;

            const newMessage = { from: fromVal, to: toVal, song: songVal, message: messageVal };
            const currentMessages = JSON.parse(localStorage.getItem('songfess_data')) || [];
            currentMessages.push(newMessage);
            localStorage.setItem('songfess_data', JSON.stringify(currentMessages));

            form.reset(); 
            statusImage.src = imgMinion;
            alert('Pesan Song Fess Terkirim! Silakan cek menu "Lihat Bubble".');
        });
    </script>
</body>
</html>
