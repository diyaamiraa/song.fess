<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess Beranda Publik</title>
    <!-- Menggunakan Tailwind CSS untuk tampilan modern -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Animasi masuk untuk bubble pesan baru */
        .bubble-entry {
            animation: popIn 0.3s ease-out forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- NAVIGASI & HEADER -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-4 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider text-indigo-400">🎵 Songfess.io</h1>
            <a href="#kirim-form" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-full text-sm transition">
                + Kirim Songfess
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-12">

        <!-- FORM KIRIM SONGFESS -->
        <section id="kirim-form" class="max-w-md mx-auto bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-center">Kirim Pesan Anonim</h2>
            <form id="songfessForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Rekomendasi Lagu</label>
                    <input type="text" id="songInput" placeholder="Contoh: Rintik Hujan - HIVI!" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Pesan Rahasia</label>
                    <textarea id="messageInput" rows="3" placeholder="Tulis ungkapan hatimu di sini..." required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 font-semibold py-2.5 rounded-lg text-sm transition">
                    Terbangkan Pesan 🚀
                </button>
            </form>
        </section>

        <!-- BERANDA BUBBLE PESAN (PUBLIK) -->
        <section>
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold">Beranda Songfess</h2>
                <p class="text-sm text-slate-400 mt-1">Semua orang bisa melihat dan membaca pesan di bawah ini secara anonim.</p>
            </div>

            <!-- Container Grid tempat menampung Bubble Pesan -->
            <div id="berandaBubble" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Data dummy jika kosong (akan diganti otomatis oleh JavaScript) -->
                <div class="col-span-full text-center text-slate-500 py-12" id="emptyState">
                    Belum ada songfess saat ini. Jadilah yang pertama!
                </div>
            </div>
        </section>

    </main>

    <!-- LOGIC JAVASCRIPT -->
    <script>
        // 1. Generate Token Unik Pengirim (disimpan di LocalStorage browser)
        // Ini berfungsi agar user bisa menghapus pesannya sendiri tanpa perlu login/akun.
        if (!localStorage.getItem('user_token')) {
            localStorage.setItem('user_token', 'user_' + Math.random().toString(36).substr(2, 9));
        }
        const currentUserToken = localStorage.getItem('user_token');

        // 2. Simulasi Database Array (Jika pakai Firebase/Supabase, ini diganti dengan fetch data realtime)
        let databaseSongfess = [
            {
                id: "msg_1",
                lagu: "Sial - Mahalini",
                pesan: "Buat kamu yang tadi duduk di pojokan perpus pakai jaket denim. Keren banget, tapi sayang gak berani kenalan.",
                token: "token_orang_lain"
            },
            {
                id: "msg_2",
                lagu: "Perfect - Ed Sheeran",
                pesan: "Semoga kamu sadar ya kalau lagu ini selalu aku putar tiap inget kamu. Kapan-kapan jalan bareng yuk?",
                token: "token_orang_lain"
            }
        ];

        // 3. Fungsi untuk Menampilkan Pesan ke Beranda (Render)
        function renderBeranda() {
            const container = document.getElementById('berandaBubble');
            const emptyState = document.getElementById('emptyState');
            
            // Hapus isi bubble lama (kecuali empty state jika dibutuhkan)
            container.innerHTML = '';

            if (databaseSongfess.length === 0) {
                container.appendChild(emptyState);
                return;
            }

            databaseSongfess.forEach(item => {
                // Cek apakah pesan ini milik user saat ini
                const isMyMessage = item.token === currentUserToken;

                // Buat elemen bubble card
                const bubble = document.createElement('div');
                bubble.className = "bg-slate-800 border border-slate-700/60 p-5 rounded-2xl relative flex flex-col justify-between bubble-entry shadow-md hover:border-slate-600 transition duration-200";
                
                bubble.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 text-xs font-medium bg-slate-900 border border-slate-700 w-fit px-2.5 py-1 rounded-full text-indigo-400 mb-3">
                            🎵 <span>${item.lagu}</span>
                        </div>
                        <p class="text-sm text-slate-300 leading-relaxed italic">"${item.pesan}"</p>
                    </div>
                    <div class="mt-4 flex justify-between items-center border-t border-slate-700/50 pt-3">
                        <span class="text-[11px] text-slate-500">Baru saja</span>
                        ${isMyMessage ? `
                            <button onclick="hapusPesan('${item.id}')" class="text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 px-2.5 py-1 rounded-md transition font-medium flex items-center gap-1">
                                🗑️ Hapus Bubble
                            </button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(bubble);
            });
        }

        // 4. Handle Event Kirim Form
        document.getElementById('songfessForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const lagu = document.getElementById('songInput').value;
            const pesan = document.getElementById('messageInput').value;
            const idBaru = 'msg_' + Date.now();

            // Masukkan data baru ke database (simulasi)
            databaseSongfess.unshift({
                id: idBaru,
                lagu: lagu,
                pesan: pesan,
                token: currentUserToken // Token kamu disimpan di sini
            });

            // Reset Form input
            document.getElementById('songInput').value = '';
            document.getElementById('messageInput').value = '';

            // Render ulang beranda agar bubble langsung muncul di paling atas
            renderBeranda();

            // Scroll mulus otomatis ke bagian beranda
            document.getElementById('berandaBubble').scrollIntoView({ behavior: 'smooth' });
        });

        // 5. Fungsi Fitur Hapus Bubble Pesan
        function hapusPesan(idPesan) {
            // Konfirmasi hapus demi keamanan
            if(confirm("Apakah kamu yakin ingin menghapus bubble songfess ini?")) {
                // Cari index pesan dan hapus dari array database
                databaseSongfess = databaseSongfess.filter(item => item.id !== idPesan);
                
                // Render ulang tampilan beranda
                renderBeranda();
            }
        }

        // Jalankan render beranda saat pertama kali web dibuka
        renderBeranda();
    </script>
</body>
</html>
