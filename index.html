<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess Hub - Kirim Pesan Musik Anonim</title>
    <style>
        /* --- CSS STYLING --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #15102a);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5rem;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            margin-bottom: 5px;
        }

        header p {
            color: #a5a1b8;
            font-size: 1rem;
        }

        /* Form Kirim Songfess */
        .form-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .form-section h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #4facfe;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #a5a1b8;
            margin-bottom: 5px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Beranda / Feed Pesan */
        .feed-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-left: 4px solid #00f2fe;
            padding-left: 10px;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Bubble Pesan Anonim */
        .songfess-bubble {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border-radius: 20px;
            padding: 20px;
            border-top-left-radius: 4px; /* Membuat efek bubble percakapan */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease-out;
        }

        .bubble-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a5a1b8;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .tag-anon {
            color: #00f2fe;
            font-weight: bold;
        }

        .music-info {
            background: rgba(0, 242, 254, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #00f2fe;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .message-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #e2e1e9;
            word-wrap: break-word;
        }

        .no-message {
            text-align: center;
            color: #a5a1b8;
            padding: 40px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>🎵 Songfess Hub</h1>
            <p>Kirim lagu dan pesan rahasiamu secara anonim. Semua orang bisa melihat.</p>
        </header>

        <!-- Form Kirim Pesan -->
        <section class="form-section">
            <h2>Kirim Songfess Baru</h2>
            <form id="songfessForm">
                <div class="input-group">
                    <label for="songTitle">Judul Lagu & Penyanyi</label>
                    <input type="text" id="songTitle" placeholder="Contoh: Hindia - Evaluasi" required>
                </div>
                <div class="input-group">
                    <label for="message">Pesan Anonim Kamu</label>
                    <textarea id="message" rows="4" placeholder="Tulis pesanmu di sini untuk seseorang..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Kirim ke Beranda 🚀</button>
            </form>
        </section>

        <!-- Beranda / Pesan yang Masuk -->
        <section class="feed-section">
            <h2>Beranda Songfess</h2>
            <div id="feedContainer" class="feed-container">
                <!-- Bubble pesan akan muncul di sini via JavaScript -->
            </div>
        </section>
    </div>

    <!-- --- JAVASCRIPT --- -->
    <script>
        const songfessForm = document.getElementById('songfessForm');
        const feedContainer = document.getElementById('feedContainer');

        // Fungsi untuk memuat semua pesan dari LocalStorage saat web dibuka
        function loadMessages() {
            feedContainer.innerHTML = ''; // Kosongkan kontainer
            
            // Ambil data dari localstorage, jika kosong buat array kosong []
            const messages = JSON.parse(localStorage.getItem('songfessMessages')) || [];

            if (messages.length === 0) {
                feedContainer.innerHTML = '<div class="no-message">Belum ada pesan songfess saat ini. Jadilah yang pertama mengirim!</div>';
                return;
            }

            // Urutkan dari yang terbaru (pesan baru di paling atas)
            messages.reverse().forEach(data => {
                const bubble = document.createElement('div');
                bubble.classList.add('songfess-bubble');

                bubble.innerHTML = `
                    <div class="bubble-header">
                        <span class="tag-anon">👤 Dari: Anonim</span>
                        <span>${data.time}</span>
                    </div>
                    <div class="music-info">
                        🎵 ${escapeHTML(data.song)}
                    </div>
                    <div class="message-content">
                        ${escapeHTML(data.text)}
                    </div>
                `;
                feedContainer.appendChild(bubble);
            });
        }

        // Fungsi saat user mengirim form
        songfessForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman web

            const songTitle = document.getElementById('songTitle').value;
            const messageText = document.getElementById('message').value;
            
            // Format waktu kirim pesan
            const now = new Date();
            const timeString = now.toLocaleDateString('id-ID') + ' | ' + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});

            // Struktur objek data pesan
            const newMessage = {
                song: songTitle,
                text: messageText,
                time: timeString
            };

            // Ambil pesan lama, masukkan pesan baru, simpan kembali ke LocalStorage
            const currentMessages = JSON.parse(localStorage.getItem('songfessMessages')) || [];
            currentMessages.push(newMessage);
            localStorage.setItem('songfessMessages', JSON.stringify(currentMessages));

            // Reset input form setelah kirim
            songfessForm.reset();

            // Refresh tampilan beranda agar pesan langsung masuk secara real-time
            loadMessages();
        });

        // Keamanan tambahan agar user tidak bisa memasukkan kode HTML aneh (XSS protection)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Jalankan fungsi muat pesan saat pertama kali web dibuka
        loadMessages();
    </script>
</body>
</html>
