<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess Anonim ✨</title>
    <!-- Menggunakan Tailwind CSS untuk tampilan bubble dan layout yang modern -->
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        /* Custom scrollbar agar lebih rapi */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 font-sans antialiased pb-12">

    <!-- Navbar / Header -->
    <header class="bg-white/10 backdrop-blur-md sticky top-0 z-50 border-b border-white/20 py-4 text-center">
        <h1 class="text-3xl font-extrabold text-white tracking-wide">🎵 Songfess Space</h1>
        <p class="text-indigo-200 text-sm mt-1">Kirim lagu dan pesan rahasiamu secara anonim</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Kolom Kiri: Form Kirim Pesan -->
        <section class="md:col-span-1">
            <div class="bg-white rounded-2xl shadow-xl p-6 sticky top-24 border border-gray-100">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    ✍️ Kirim Songfess
                </h2>
                <form id="songfessForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">From</label>
                        <input type="text" id="fromInput" placeholder="Contoh: Secret Admirer (atau kosongi)" 
                            class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">To</label>
                        <input type="text" id="toInput" required placeholder="Siapa penerimanya?" 
                            class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Song</label>
                        <input type="text" id="songInput" required placeholder="Judul Lagu - Penyanyi" 
                            class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Message</label>
                        <textarea id="messageInput" required rows="4" placeholder="Tulis pesan rahasiamu di sini..." 
                            class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-gray-50 resize-none"></textarea>
                    </div>
                    <button type="submit" 
                        class="w-full py-3 bg-gradient-to-r #667eea from-indigo-500 to-purple-600 text-white font-semibold rounded-xl shadow-md hover:opacity-90 transition duration-200 text-sm">
                        Kirim Sekarang 🚀
                    </button>
                </form>
            </div>
        </section>

        <!-- Kolom Kanan: Beranda Pesan (Bubble) -->
        <section class="md:col-span-2">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    🏠 Beranda Songfess
                </h2>
                <span id="countBadge" class="bg-white/20 text-white text-xs px-3 py-1 rounded-full font-medium backdrop-blur-sm">
                    0 Pesan
                </span>
            </div>

            <!-- Wadah tempat bubble pesan muncul -->
            <div id="berandaPesan" class="space-y-4">
                <!-- Pesan akan di-render di sini menggunakan JavaScript -->
            </div>
        </section>

    </main>

    <script>
        // Mengambil elemen HTML
        const form = document.getElementById('songfessForm');
        const berandaPesan = document.getElementById('berandaPesan');
        const countBadge = document.getElementById('countBadge');

        // Fungsi untuk mengambil pesan dari localStorage
        function getMessages() {
            const messages = localStorage.getItem('songfess_messages');
            return messages ? JSON.parse(messages) : [];
        }

        // Fungsi untuk menampilkan (render) semua pesan ke beranda
        function renderMessages() {
            const messages = getMessages();
            berandaPesan.innerHTML = ''; // Kosongkan beranda dulu
            countBadge.textContent = `${messages.length} Pesan`;

            if (messages.length === 0) {
                berandaPesan.innerHTML = `
                    <div class="bg-white/10 border border-white/10 rounded-2xl p-8 text-center text-indigo-100 backdrop-blur-sm">
                        Belum ada songfess nih. Yuk jadi yang pertama mengirim! 🤍
                    </div>
                `;
                return;
            }

            // Loop data dari yang terbaru (dibalik menggunakan reverse)
            messages.slice().reverse().forEach(data => {
                const bubble = document.createElement('div');
                bubble.className = "bg-white/95 rounded-2xl p-5 shadow-lg border border-gray-100 hover:transform hover:-translate-y-1 transition duration-200 relative overflow-hidden backdrop-blur-sm";
                
                bubble.innerHTML = `
                    <!-- Dekorasi Musik di Pojok Bubble -->
                    <div class="absolute right-4 top-4 text-indigo-200 text-3xl font-bold select-none pointer-events-none">🎵</div>
                    
                    <!-- Metadata: From & To -->
                    <div class="flex flex-wrap gap-2 text-xs font-bold text-indigo-600 uppercase tracking-wider mb-2">
                        <span class="bg-indigo-50 px-2 py-1 rounded-md">From: ${escapeHTML(data.from)}</span>
                        <span class="bg-purple-50 text-purple-600 px-2 py-1 rounded-md">To: ${escapeHTML(data.to)}</span>
                    </div>

                    <!-- Judul Lagu -->
                    <div class="bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-100/50 rounded-xl p-2.5 mb-3 flex items-center gap-2">
                        <span class="text-lg">🎧</span>
                        <div class="text-sm">
                            <p class="font-semibold text-gray-500 text-xs uppercase tracking-tight">Song Request</p>
                            <p class="font-bold text-indigo-900">${escapeHTML(data.song)}</p>
                        </div>
                    </div>

                    <!-- Isi Pesan -->
                    <p class="text-gray-700 text-sm leading-relaxed bg-gray-50/50 p-3 rounded-xl border border-gray-100 whitespace-pre-line">${escapeHTML(data.message)}</p>
                    
                    <!-- Waktu Kirim -->
                    <div class="text-[10px] text-gray-400 mt-3 text-right">
                        Diposting secara anonim • ${data.time}
                    </div>
                `;
                berandaPesan.appendChild(bubble);
            });
        }

        // Fungsi untuk menangani submit form
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman

            // Ambil nilai input
            const from = document.getElementById('fromInput').value.trim() || 'Anonymous';
            const to = document.getElementById('toInput').value.trim();
            const song = document.getElementById('songInput').value.trim();
            const message = document.getElementById('messageInput').value.trim();
            
            // Format waktu saat ini
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' - ' + now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

            // Buat objek pesan baru
            const newMessage = {
                from: from,
                to: to,
                song: song,
                message: message,
                time: timeString
            };

            // Simpan ke array localStorage
            const currentMessages = getMessages();
            currentMessages.push(newMessage);
            localStorage.setItem('songfess_messages', JSON.stringify(currentMessages));

            // Reset form input setelah kirim
            form.reset();

            // Refresh beranda agar pesan baru langsung muncul secara instan
            renderMessages();
        });

        // Keamanan: Fungsi untuk mencegah XSS (hacker menyuntikkan kode HTML berbahaya)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Jalankan fungsi tampilkan pesan saat pertama kali web dibuka
        renderMessages();
    </script>
</body>
</html>
