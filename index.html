<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess Menfess Publik</title>
    <!-- Memuat Library Supabase Cloud untuk Database Publik -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- CSS STYLING --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Form Kirim Pesan */
        .form-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }

        .form-section h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(236, 72, 153, 0.4);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #db2777;
        }

        /* Beranda Pesan (Bubble Cards) */
        .feed-section h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            color: var(--text-main);
        }

        .bubble-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 600px) {
            .bubble-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .bubble-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--bg-color) 100%);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: fadeIn 0.5s ease-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .song-tag {
            background-color: rgba(236, 72, 153, 0.15);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 500;
            width: fit-content;
        }

        .song-tag::before {
            content: "🎵 ";
            margin-right: 5px;
        }

        .message-content {
            font-size: 1rem;
            line-height: 1.5;
            color: #e2e8f0;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .no-message {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Songfess Menfess</h1>
        <p>Kirim pesan & lagu secara anonim. Baca pesan dari orang lain tanpa harus mengirim pesan dulu.</p>
    </header>

    <div class="container">
        <!-- SEKSI KIRIM PESAN -->
        <section class="form-section">
            <h2>Kirim Songfess Baru</h2>
            <form id="songfessForm">
                <div class="form-group">
                    <label for="fromInput">From (Bisa samaran/inisial):</label>
                    <input type="text" id="fromInput" placeholder="Contoh: Secret Admirer / K" required>
                </div>
                <div class="form-group">
                    <label for="toInput">To:</label>
                    <input type="text" id="toInput" placeholder="Contoh: Bunga Kelas Sebelah" required>
                </div>
                <div class="form-group">
                    <label for="songInput">Song (Judul & Penyanyi):</label>
                    <input type="text" id="songInput" placeholder="Contoh: Tulus - Hati-Hati di Jalan" required>
                </div>
                <div class="form-group">
                    <label for="messageInput">Message:</label>
                    <textarea id="messageInput" placeholder="Tuliskan pesan rahasiamu di sini..." required></textarea>
                </div>
                <button type="submit" id="submitBtn">Kirim!</button>
            </form>
        </section>

        <!-- SEKSI BERANDA PESAN (PUBLIK) -->
        <section class="feed-section">
            <h2>Beranda Songfess Terkini</h2>
            <div class="bubble-container" id="bubbleContainer">
                <p class="no-message">Memuat pesan dari database...</p>
            </div>
        </section>
    </div>

    <!-- --- JAVASCRIPT --- -->
    <script>
        // Konfigurasi Database Publik Cloud Demo
        const SUPABASE_URL = "https://wzsnwuzwclgbyghpghrp.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6c253dXp3Y2xnYnlnaHBnaHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDkyMzg0MDAsImV4cCI6MjAyNDgzODQwMH0.bThFOWFmZGMzYzhkYjg4M2Y4Yzg4Yzg4Yzg4Yzg4Yzg4Yzg4Yzg4";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const songfessForm = document.getElementById('songfessForm');
        const bubbleContainer = document.getElementById('bubbleContainer');
        const submitBtn = document.getElementById('submitBtn');

        // Fungsi mengamankan teks dari karakter HTML berbahaya (XSS Protection)
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Fungsi Mengambil Daftar Pesan dari Database Publik
        async function fetchMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                bubbleContainer.innerHTML = '<p class="no-message">Gagal memuat pesan. Periksa koneksi internet Anda.</p>';
                return;
            }

            bubbleContainer.innerHTML = '';

            if (!data || data.length === 0) {
                bubbleContainer.innerHTML = '<p class="no-message">Belum ada pesan masuk. Jadilah yang pertama mengirim!</p>';
                return;
            }

            // Tampilkan pesan ke dalam bubble card di beranda
            data.forEach(item => {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble-card');
                
                bubble.innerHTML = `
                    <div class="bubble-header">
                        <span><strong>From:</strong> ${escapeHTML(item.from)}</span>
                        <span><strong>To:</strong> ${escapeHTML(item.to)}</span>
                    </div>
                    <div class="song-tag">${escapeHTML(item.song)}</div>
                    <div class="message-content">${escapeHTML(item.message)}</div>
                `;
                bubbleContainer.appendChild(bubble);
            });
        }

        // Event saat tombol "Kirim!" ditekan
        songfessForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            submitBtn.innerText = "Mengirim...";
            submitBtn.disabled = true;

            const fromValue = document.getElementById('fromInput').value;
            const toValue = document.getElementById('toInput').value;
            const songValue = document.getElementById('songInput').value;
            const messageValue = document.getElementById('messageInput').value;

            // Masukkan data ke database cloud publik
            const { error } = await supabase
                .from('messages')
                .insert([
                    { from: fromValue, to: toValue, song: songValue, message: messageValue }
                ]);

            if (error) {
                alert("Gagal mengirim pesan, silakan coba lagi!");
            } else {
                songfessForm.reset(); // Mengosongkan form otomatis
                fetchMessages();      // Langsung muat ulang beranda agar pesan baru muncul
            }

            submitBtn.innerText = "Kirim!";
            submitBtn.disabled = false;
        });

        // Muat pesan saat pertama kali dibuka & cek pembaruan otomatis setiap 5 detik
        fetchMessages();
        setInterval(fetchMessages, 5000);
    </script>
</body>
</html>
