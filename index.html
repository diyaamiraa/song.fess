<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Fess - Sampaikan Perasaanmu</title>
    <!-- Menggunakan Tailwind CSS untuk mempermudah styling -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
        }
        /* Custom border warna emas tipis sesuai gambar */
        .custom-border {
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .custom-border:focus-within {
            border: 1px solid rgba(212, 175, 55, 1);
        }
        /* Animasi pop up lembut untuk bubble pesan baru */
        .bubble-anim {
            animation: popUp 0.4s ease-out forwards;
        }
        @keyframes popUp {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-white min-h-screen pb-12">

    <!-- MAIN CONTAINER FORM (Sesuai Gambar) -->
    <div class="max-w-xl mx-auto mt-10 px-4">
        <div class="border border-zinc-700/60 rounded-2xl p-6 md:p-8 bg-zinc-950/40 backdrop-blur-sm">
            
            <!-- HEADER -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold flex items-center justify-center gap-2 tracking-wide">
                    <span>♪</span> Song Fess
                </h1>
                <p class="text-xs text-zinc-400 mt-1">Sampaikan perasaanmu lewat lagu secara rahasia.</p>
            </div>

            <!-- FORM INPUT -->
            <form id="songfessForm" class="space-y-5">
                <!-- FROM -->
                <div>
                    <label class="block text-xs font-bold tracking-wider text-zinc-300 uppercase mb-1.5">From (Pengirim)</label>
                    <input type="text" id="fromInput" required placeholder="Contoh: Anonim / Rahasia" 
                        class="w-full bg-black text-sm text-zinc-200 px-4 py-3 rounded-xl border border-zinc-700 focus:outline-none focus:border-yellow-500/70 transition">
                </div>

                <!-- TO -->
                <div>
                    <label class="block text-xs font-bold tracking-wider text-zinc-300 uppercase mb-1.5">To (Untuk Siapa)</label>
                    <input type="text" id="toInput" required placeholder="Nama si dia..." 
                        class="w-full bg-black text-sm text-zinc-200 px-4 py-3 rounded-xl border border-zinc-700 focus:outline-none focus:border-yellow-500/70 transition">
                </div>

                <!-- SONG -->
                <div>
                    <label class="block text-xs font-bold tracking-wider text-zinc-300 uppercase mb-1.5">Song (Lagu & Penyanyi)</label>
                    <input type="text" id="songInput" required placeholder="Contoh: Hindia - Evaluasi" 
                        class="w-full bg-black text-sm text-zinc-200 px-4 py-3 rounded-xl border border-zinc-700 focus:outline-none focus:border-yellow-500/70 transition">
                </div>

                <!-- MESSAGE -->
                <div>
                    <label class="block text-xs font-bold tracking-wider text-zinc-300 uppercase mb-1.5">Message (Pesan)</label>
                    <textarea id="messageInput" required rows="4" placeholder="Tuliskan semua perasaanmu di sini..." 
                        class="w-full bg-black text-sm text-zinc-200 px-4 py-3 rounded-xl border border-zinc-700 focus:outline-none focus:border-yellow-500/70 transition resize-none"></textarea>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="w-full text-yellow-400 font-semibold text-sm py-3 mt-2 flex items-center justify-center gap-2 hover:text-yellow-300 active:scale-95 transition">
                    📌 Send the Song
                </button>
            </form>

        </div>
    </div>

    <!-- BERANDA MENFESS TERKINI (PUBLIK) -->
    <div class="max-w-2xl mx-auto mt-12 px-4">
        <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-6">
            <h2 class="text-lg font-bold tracking-wide flex items-center gap-2">
                ✉ Beranda Menfess Terkini
            </h2>
            <span id="totalPesan" class="text-xs bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full">0 Pesan</span>
        </div>

        <!-- Wadah Tempat Tumpukan Bubble Chat Publik -->
        <div id="bubbleWall" class="space-y-4">
            <!-- Pesan publik otomatis masuk ke sini melalui JavaScript -->
        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA UTAMA -->
    <script>
        const songfessForm = document.getElementById('songfessForm');
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const songInput = document.getElementById('songInput');
        const messageInput = document.getElementById('messageInput');
        const bubbleWall = document.getElementById('bubbleWall');
        const totalPesanLabel = document.getElementById('totalPesan');

        // Fungsi memuat data dari localStorage agar bersifat persisten di browser
        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('darkSongfessMessages')) || [];
            bubbleWall.innerHTML = '';
            totalPesanLabel.textContent = `${messages.length} Pesan`;

            if (messages.length === 0) {
                bubbleWall.innerHTML = `
                    <div class="text-center py-10 border border-dashed border-zinc-800 rounded-xl">
                        <p class="text-sm text-zinc-500">Belum ada menfess publik. Yuk jadi yang pertama mengirim!</p>
                    </div>
                `;
                return;
            }

            // Menampilkan dari kiriman paling baru di posisi atas
            messages.reverse().forEach(data => {
                const bubble = document.createElement('div');
                bubble.className = "p-5 rounded-xl border border-zinc-800 bg-zinc-950/70 bubble-anim shadow-lg";
                
                bubble.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-zinc-400 mb-3 border-b border-zinc-900 pb-2">
                        <div class="flex items-center gap-1.5">
                            <span class="font-medium text-zinc-300">From:</span>
                            <span class="text-yellow-400/90 font-semibold bg-zinc-900 px-2 py-0.5 rounded">${data.from}</span>
                            <span class="font-medium text-zinc-300 ml-1">To:</span>
                            <span class="text-teal-400 font-semibold bg-zinc-900 px-2 py-0.5 rounded">${data.to}</span>
                        </div>
                        <span class="text-[10px] text-zinc-500">${data.time}</span>
                    </div>
                    <p class="text-sm text-zinc-200 leading-relaxed mb-4 italic">"${data.message}"</p>
                    <div class="inline-flex items-center gap-2 text-xs bg-zinc-900/80 px-3 py-1.5 rounded-lg border border-zinc-800/60 text-zinc-300">
                        <span>🎵</span>
                        <span class="font-medium text-zinc-200">${data.song}</span>
                    </div>
                `;
                bubbleWall.appendChild(bubble);
            });
        }

        // Fungsi menangkap submit form kirim lagu
        songfessForm.addEventListener('submit', function(e) {
            e.preventDefault();

            // Format tanggal & waktu pengiriman
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' - ' + now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

            const newMessage = {
                from: fromInput.value.trim(),
                to: toInput.value.trim(),
                song: songInput.value.trim(),
                message: messageInput.value.trim(),
                time: timeString
            };

            // Simpan ke database lokal browser
            const currentMessages = JSON.parse(localStorage.getItem('darkSongfessMessages')) || [];
            currentMessages.push(newMessage);
            localStorage.setItem('darkSongfessMessages', JSON.stringify(currentMessages));

            // Reset semua isi kolom input setelah berhasil terkirim
            songfessForm.reset();

            // Refresh tampilan beranda secara real-time
            loadMessages();
        });

        // Panggil fungsi muat pesan saat halaman pertama kali dibuka
        loadMessages();
    </script>
</body>
</html>
