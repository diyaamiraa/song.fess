<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Fess</title>
    <style>
        /* RESET & BASE STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CONTAINER FORM UTAMA */
        .form-container {
            width: 100%;
            max-width: 520px;
            border: 1px solid #333333;
            border-radius: 16px;
            padding: 30px;
            background-color: #000000;
            margin-bottom: 40px;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 13px;
            color: #aaaaaa;
        }

        /* FORM & INPUT */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .form-group input, 
        .form-group textarea {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #d4af37; /* Border Kuning Emas */
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
        }
        .form-group input::placeholder, 
        .form-group textarea::placeholder {
            color: #555555;
        }
        .form-group textarea {
            resize: none;
        }

        /* BUTTON SEND THE SONG */
        .btn-submit {
            width: 100%;
            background: none;
            border: none;
            color: #d4af37;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            color: #fff3cc;
        }

        /* BERANDA PESAN */
        .beranda-container {
            width: 100%;
            max-width: 520px;
        }
        .beranda-title {
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid #222222;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-badge {
            font-size: 11px;
            background-color: #222222;
            color: #aaaaaa;
            padding: 3px 8px;
            border-radius: 12px;
        }

        /* WADAH TEMPAT BUBBLE CHAT */
        .bubble-wall {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #555555;
            font-size: 13px;
            border: 1px dashed #222222;
            border-radius: 12px;
        }

        /* STYLE BUBBLE CARD PESAN */
        .bubble-card {
            border: 1px solid #222222;
            background-color: #0a0a0a;
            border-radius: 12px;
            padding: 16px;
        }
        .bubble-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #888888;
            margin-bottom: 10px;
            border-bottom: 1px solid #161616;
            padding-bottom: 8px;
        }
        .meta-users {
            display: flex;
            gap: 8px;
        }
        .user-highlight {
            color: #d4af37;
            font-weight: 600;
        }
        .bubble-message {
            font-size: 14px;
            color: #e5e5e5;
            line-height: 1.5;
            margin-bottom: 12px;
            font-style: italic;
        }
        .bubble-song {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            background-color: #161616;
            color: #d4af37;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #222222;
        }
    </style>
</head>
<body>

    <!-- CONTAINER FORM UTAMA -->
    <div class="form-container">
        <!-- HEADER -->
        <div class="header">
            <h1>♪ Song Fess</h1>
            <p>Sampaikan perasaanmu lewat lagu secara rahasia.</p>
        </div>

        <!-- INPUT FIELDS (Tanpa tag form untuk mencegah auto-refresh) -->
        <div class="form-group">
            <label>From (Pengirim)</label>
            <input type="text" id="fromInput" placeholder="Contoh: Anonim / Rahasia">
        </div>

        <div class="form-group">
            <label>To (Untuk Siapa)</label>
            <input type="text" id="toInput" placeholder="Nama si dia...">
        </div>

        <div class="form-group">
            <label>Song (Lagu & Penyanyi)</label>
            <input type="text" id="songInput" placeholder="Contoh: Hindia - Evaluasi">
        </div>

        <div class="form-group">
            <label>Message (Pesan)</label>
            <textarea id="messageInput" rows="4" placeholder="Tuliskan semua perasaanmu di sini..."></textarea>
        </div>

        <!-- BUTTON DENGAN ONCLICK JAVASCRIPT -->
        <button type="button" id="submitBtn" class="btn-submit">
            📌 Send the Song
        </button>
    </div>

    <!-- BERANDA MENFESS PUBLIK -->
    <div class="beranda-container">
        <div class="beranda-title">
            <span>🗂 Beranda Menfess Terkini</span>
            <span id="totalPesan" class="total-badge">0 Pesan</span>
        </div>

        <!-- Wadah Tempat Bubble Chat -->
        <div id="bubbleWall" class="bubble-wall">
            <!-- Pesan masuk di sini -->
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT MURNI -->
    <script>
        const fromInput = document.getElementById('fromInput');
        const toInput = document.getElementById('toInput');
        const songInput = document.getElementById('songInput');
        const messageInput = document.getElementById('messageInput');
        const bubbleWall = document.getElementById('bubbleWall');
        const totalPesanLabel = document.getElementById('totalPesan');
        const submitBtn = document.getElementById('submitBtn');

        // Fungsi menampilkan pesan ke layar beranda bubble
        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('pureCssSongfessFix')) || [];
            bubbleWall.innerHTML = '';
            totalPesanLabel.textContent = `${messages.length} Pesan`;

            if (messages.length === 0) {
                bubbleWall.innerHTML = `
                    <div class="empty-state">
                        Belum ada menfess publik. Yuk jadi yang pertama mengirim!
                    </div>
                `;
                return;
            }

            // Urutkan dari yang terbaru ke terlama
            const reversedMessages = messages.slice().reverse();

            reversedMessages.forEach(data => {
                const card = document.createElement('div');
                card.className = "bubble-card";
                card.innerHTML = `
                    <div class="bubble-meta">
                        <div class="meta-users">
                            <span>From: <span class="user-highlight">${escapeHtml(data.from)}</span></span>
                            <span>To: <span class="user-highlight">${escapeHtml(data.to)}</span></span>
                        </div>
                        <div>${data.time}</div>
                    </div>
                    <div class="bubble-message">"${escapeHtml(data.message)}"</div>
                    <div class="bubble-song">
                        <span>🎵</span> ${escapeHtml(data.song)}
                    </div>
                `;
                bubbleWall.appendChild(card);
            });
        }

        // Pengaman input teks
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Trigger pengiriman menggunakan Event Listener Klik langsung
        submitBtn.addEventListener('click', function() {
            // Validasi manual agar input wajib diisi
            if (!fromInput.value.trim() || !toInput.value.trim() || !songInput.value.trim() || !messageInput.value.trim()) {
                alert("Harap isi semua kolom terlebih dahulu!");
                return;
            }

            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' | ' + now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

            const newMessage = {
                from: fromInput.value.trim(),
                to: toInput.value.trim(),
                song: songInput.value.trim(),
                message: messageInput.value.trim(),
                time: timeString
            };

            // Simpan data
