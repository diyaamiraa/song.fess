<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess Bubble Wall</title>
    <!-- Menggunakan Tailwind CSS untuk tampilan yang modern dan bagus -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        /* Efek animasi untuk bubble chat baru */
        .bubble-anim {
            animation: popUp 0.4s ease-out forwards;
        }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <!-- NAVBAR -->
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent">
                🎵 SongfessBubble
            </h1>
            <a href="#kirim-pesan" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-full text-sm font-medium transition duration-300 shadow-md">
                Kirim Menfess
            </a>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- KOLOM KIRI: FORM KIRIM PESAN -->
        <div id="kirim-pesan" class="lg:col-span-1">
            <div class="bg-white p-6 rounded-2xl shadow-xl sticky top-20 border border-gray-100">
                <h2 class="text-xl font-bold mb-2 text-purple-700">Kirim Pesan Anonim</h2>
                <p class="text-xs text-gray-500 mb-6">Bagikan lagu favorit atau pesan rahasiamu. Semua orang bisa melihatnya secara anonim!</p>
                
                <form id="songfessForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Judul Lagu / Penyanyi</label>
                        <input type="text" id="songInput" required placeholder="Contoh: Cinta Luar Biasa - Andmesh" 
                            class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pesan Anonim</label>
                        <textarea id="messageInput" required rows="4" placeholder="Tulis pesan rahasiamu di sini..." 
                            class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:outline-none transition resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-300 transform active:scale-95">
                        Kirim ke Beranda ✨
                    </button>
                </form>
            </div>
        </div>

        <!-- KOLOM KANAN: BERANDA BUBBLE PESAN (PUBLIK) -->
        <div class="lg:col-span-2">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Beranda Pesan</h2>
                <span id="totalPesan" class="bg-purple-100 text-purple-800 text-xs font-semibold px-3 py-1 rounded-full">0 Pesan</span>
            </div>

            <!-- Wadah Bubble Chat -->
            <div id="bubbleWall" class="space-y-4 max-h-[80vh] overflow-y-auto pr-2">
                <!-- Pesan akan muncul di sini secara dinamis -->
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT & LOGIKA -->
    <script>
        const songfessForm = document.getElementById('songfessForm');
        const songInput = document.getElementById('songInput');
        const messageInput = document.getElementById('messageInput');
        const bubbleWall = document.getElementById('bubbleWall');
        const totalPesanLabel = document.getElementById('totalPesan');

        // Pilihan warna estetik pastel untuk bubble chat secara acak
        const bubbleColors = [
            'bg-purple-50 border-purple-200 text-purple-900',
            'bg-pink-50 border-pink-200 text-pink-900',
            'bg-blue-50 border-blue-200 text-blue-900',
            'bg-indigo-50 border-indigo-200 text-indigo-900',
            'bg-teal-50 border-teal-200 text-teal-900'
        ];

        // 1. Fungsi untuk mengambil dan menampilkan pesan dari LocalStorage
        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('songfessMessages')) || [];
            bubbleWall.innerHTML = '';
            totalPesanLabel.textContent = `${messages.length} Pesan`;

            if (messages.length === 0) {
                bubbleWall.innerHTML = `
                    <div class="text-center py-12 bg-white/50 backdrop-blur rounded-2xl border-2 border-dashed border-gray-300">
                        <p class="text-gray-500">Belum ada pesan nih. Jadi yang pertama mengirim!</p>
                    </div>
                `;
                return;
            }

            // Tampilkan dari yang paling baru (diatas)
            messages.reverse().forEach(data => {
                const bubble = document.createElement('div');
                // Mengacak warna bubble
                const randomColor = bubbleColors[data.colorIndex || 0];
                
                bubble.className = `p-5 rounded-2xl border shadow-sm bubble-anim ${randomColor}`;
                bubble.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold uppercase tracking-wider bg-white/80 px-2 py-0.5 rounded-md shadow-xs text-gray-600">
                            👤 Anonim
                        </span>
                        <span class="text-[10px] text-gray-500">${data.time}</span>
                    </div>
                    <p class="text-base font-medium mb-3 italic">"${data.message}"</p>
                    <div class="flex items-center gap-2 text-xs bg-white/60 p-2 rounded-xl w-fit">
                        <span>🎵</span>
                        <span class="font-semibold text-gray-700">${data.song}</span>
                    </div>
                `;
                bubbleWall.appendChild(bubble);
            });
        }

        // 2. Fungsi saat User Mengirim Pesan
        songfessForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const songText = songInput.value.trim();
            const messageText = messageInput.value.trim();
            
            // Format waktu saat ini
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' | ' + now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

            // Acak index warna
            const randomColorIndex = Math.floor(Math.random() * bubbleColors.length);

            const newMessage = {
                song: songText,
                message: messageText,
                time: timeString,
                colorIndex: randomColorIndex
            };

            // Simpan ke LocalStorage publik browser
            const currentMessages = JSON.parse(localStorage.getItem('songfessMessages')) || [];
            currentMessages.push(newMessage);
            localStorage.setItem('songfessMessages', JSON.stringify(currentMessages));

            // Reset Form setelah kirim
            songfessForm.reset();

            // Refresh beranda web agar langsung muncul pesan barunya
            loadMessages();

            // Scroll otomatis ke atas beranda pesan
            bubbleWall.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Jalankan fungsi load pertama kali web dibuka
        loadMessages();
    </script>
</body>
</html>
