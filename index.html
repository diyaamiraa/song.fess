<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Fess Interactive App</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* BOX TEMPAT TAMPILAN GAMBAR DI ATAS */
        .image-container {
            margin: 20px 0;
            text-align: center;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1; /* Mencegah gambar menutupi tombol menu */
        }

        .dynamic-img {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        /* BAR NAVIGASI MENU BUTTONS */
        .nav-menu {
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 35px;
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 10; /* Menjamin menu berada paling depan agar bisa diklik */
        }

        .menu-btn {
            background: transparent;
            color: #b3b3b3;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            color: #ffffff;
        }

        .menu-btn.active {
            background: #1db954;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        /* LAYOUT HALAMAN KONTEN */
        .page-content {
            width: 100%;
            max-width: 520px;
            display: none;
            animation: fadeIn 0.4s ease;
            position: relative;
            z-index: 5;
        }

        .page-content.visible {
            display: block;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #1db954;
        }

        .fess-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1db954;
            text-transform: uppercase;
        }

        .input-group input, .input-group textarea {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            color: #ffffff;
            outline: none;
            font-size: 0.95rem;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: #1db954;
        }

        .btn-submit {
            background: #1db954;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover { background: #1ed760; }

        /* BUBBLE TIMELINE CHAT */
        .message-wall {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bubble {
            background: rgba(255, 255, 255, 0.08);
            border-left: 5px solid #1db954;
            padding: 18px;
            border-radius: 0 15px 15px 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .bubble-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #1db954;
            margin-bottom: 6px;
            font-weight: bold;
            padding-right: 25px;
        }

        .bubble-song {
            background: rgba(29, 185, 84, 0.15);
            color: #1ed760;
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        /* TOMBOL HAPUS BUBBLE */
        .btn-delete {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #ff4d4d;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-delete:hover {
            transform: scale(1.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. KOTAK TEMPAT GAMBAR DINAMIS -->
    <div class="image-container">
        <!-- Default awal diisi langsung dengan Link Gambar Kucing "Hi" yang asli -->
        <img id="statusImage" src="https://phototourl.com" alt="Status" class="dynamic-img">
    </div>

    <!-- 2. BAR MENU PILIHAN -->
    <div class="nav-menu">
        <button id="btnKirim" class="menu-btn" onclick="switchPage('kirim')">📝 Kirim Pesan</button>
        <button id="btnLihat" class="menu-btn" onclick="switchPage('lihat')">📩 Lihat Bubble</button>
    </div>

    <!-- HALAMAN OPSI 1: FORM KIRIM PESAN -->
    <div id="pageKirim" class="page-content">
        <div class="container">
            <h2 class="header-title">🎵 Send a Songfess</h2>
            <form id="songfessForm" class="fess-form">
                <div class="input-group">
                    <label>From (Pengirim)</label>
                    <input type="text" id="from" placeholder="Anonim / Rahasia" required>
                </div>
                <div class="input-group">
                    <label>To (Untuk Siapa)</label>
                    <input type="text" id="to" placeholder="Nama target si dia..." required>
                </div>
                <div class="input-group">
                    <label>Song (Lagu & Artis)</label>
                    <input type="text" id="song" placeholder="Contoh: Hindia - Evaluasi" required>
                </div>
                <div class="input-group">
                    <label>Message (Pesan Rahasia)</label>
                    <textarea id="message" rows="4" placeholder="Tulis ungkapan hatimu..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">🚀 Send the Song</button>
            </form>
        </div>
    </div>

    <!-- HALAMAN OPSI 2: BERANDA TIMELINE BUBBLE CHAT -->
    <div id="pageLihat" class="page-content">
        <div class="container">
            <h2 class="header-title" style="color: #1ed760;">📩 Timeline Menfess</h2>
            <div id="messageWall" class="message-wall">
                <!-- Bubble otomatis diisi lewat JavaScript -->
            </div>
        </div>
    </div>

    <script>
        const statusImage = document.getElementById('statusImage');
        const pageKirim = document.getElementById('pageKirim');
        const pageLihat = document.getElementById('pageLihat');
        const btnKirim = document.getElementById('btnKirim');
        const btnLihat = document.getElementById('btnLihat');
        const form = document.getElementById('songfessForm');

        // VARIABEL LINK GAMBAR YANG SUDAH TERINTEGRASI ASLI
        const imgHi = "https://phototourl.com"; // Kucing Hi
        const imgCat = "https://squarespace-cdn.com"; // Kucing You Can Do This (Cadangan Sementara)
        const imgMinion = "https://cdn.phototourl.com/member/2026-11-10-39ad4ef4-c4ab-405a-b32a-1e93b0762857.jpg"; // Minion How Bro Felt

        // Memastikan gambar pertama langsung tampil secara fisik sejak awal
        statusImage.src = imgHi;

        // FUNGSI GANTI HALAMAN OPSI MENU
        function switchPage(target) {
            btnKirim.classList.remove('active');
            btnLihat.classList.remove('active');
            pageKirim.classList.remove('visible');
            pageLihat.classList.remove('visible');

            if (target === 'kirim') {
                pageKirim.classList.add('visible');
                btnKirim.classList.add('active');
                statusImage.src = imgCat; // Mengubah tampilan gambar ke Kucing "You Can Do This"
            } else if (target === 'lihat') {
                pageLihat.classList.add('visible');
                btnLihat.classList.add('active');
                displayMessages();
            }
        }
