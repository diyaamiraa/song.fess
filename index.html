<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess - Kirim Pesan Rahasia & Lagu</title>
    <style>
        /* --- CSS STYLING --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        header p {
            color: var(--text-muted);
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Form Kirim Pesan */
        .form-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            border: 1px solid #334155;
        }

        .form-section h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(236, 72, 153, 0.4);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #db2777;
        }

        /* Beranda Pesan (Bubble) */
        .feed-section h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            color: var(--text-main);
        }

        .bubble-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 600px) {
            .bubble-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .bubble-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            border-bottom: 1px dashed #334155;
            padding-bottom: 8px;
        }

        .song-tag {
            background-color: rgba(236, 72, 153, 0.15);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .song-tag::before {
            content: "🎵 ";
            margin-right: 5px;
        }

        .message-content {
            font-size: 1rem;
            line-height: 1.5;
            color: #e2e8f0;
            word-wrap: break-word;
        }

        .no-message {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Songfess Menfess</h1>
        <p>Kirim pesan & lagu secara anonim. Semua orang bisa membaca.</p>
    </header>

    <div class="container">
        <!-- SEKSI KIRIM PESAN -->
        <section class="form-section">
            <h2>Kirim Songfess Baru</h2>
            <form id="songfessForm">
                <div class="form-group">
                    <label for="fromInput">From (Bisa samaran/inisial):</label>
                    <input type="text" id="fromInput" placeholder="Contoh: Secret Admirer / K" required>
                </div>
                <div class="form-group">
                    <label for="toInput">To:</label>
                    <input type="text" id="toInput" placeholder="Contoh: Bunga Kelas sebelah / Dia" required>
                </div>
                <div class="form-group">
                    <label for="songInput">Song (Judul & Penyanyi):</label>
                    <input type="text" id="songInput" placeholder="Contoh: Hati-Hati di Jalan - Tulus" required>
                </div>
                <div class="form-group">
                    <label for="messageInput">Message:</label>
                    <textarea id="messageInput" placeholder="Tuliskan pesan rahasiamu di sini..." required></textarea>
                </div>
                <button type="submit">Kirim Pesan Publik 🚀</button>
            </form>
        </section>

        <!-- SEKSI BERANDA PESAN -->
        <section class="feed-section">
            <h2>Beranda Songfess Terkini</h2>
            <div class="bubble-container" id="bubbleContainer">
                <!-- Pesan akan masuk ke sini melalui Javascript -->
            </div>
        </section>
    </div>

    <!-- --- JAVASCRIPT --- -->
    <script>
        const songfessForm = document.getElementById('songfessForm');
        const bubbleContainer = document.getElementById('bubbleContainer');

        // Fungsi mengambil pesan dari LocalStorage
        function getMessages() {
            const messages = localStorage.getItem('songfess_messages');
            return messages ? JSON.parse(messages) : [];
        }

        // Fungsi menampilkan semua pesan ke beranda
        function displayMessages() {
            const messages = getMessages();
            bubbleContainer.innerHTML = ''; // Kosongkan kontainer terlebih dahulu

            if (messages.length === 0) {
                bubbleContainer.innerHTML = '<p class="no-message">Belum ada pesan masuk. Jadilah yang pertama mengirim!</p>';
                return;
            }

            // Urutkan dari yang paling baru di atas
            messages.reverse().forEach(data => {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble-card');
                
                bubble.innerHTML = `
                    <div class="bubble-header">
                        <span><strong>From:</strong> ${escapeHTML(data.from)}</span>
                        <span><strong>To:</strong> ${escapeHTML(data.to)}</span>
                    </div>
                    <div class="song-tag">${escapeHTML(data.song)}</div>
                    <div class="message-content">
                        ${escapeHTML(data.message).replace(/\n/g, '<br>')}
                    </div>
                `;
                bubbleContainer.appendChild(bubble);
            });
        }

        // Fungsi mengamankan teks input dari serangan XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Event listener saat form dikirim
        songfessForm.addEventListener('submit', function(e) {
            e.preventDefault();

            // Ambil data nilai dari form
            const from = document.getElementById('fromInput').value;
            const to = document.getElementById('toInput').value;
            const song = document.getElementById('songInput').value;
            const message = document.getElementById('messageInput').value;

            const newSongfess = { from, to, song, message };

            // Simpan ke array local storage
            const currentMessages = getMessages();
            currentMessages.push(newSongfess);
            localStorage.setItem('songfess_messages', JSON.stringify(currentMessages));

            // Reset form input
            songfessForm.reset();

            // Refresh beranda tampilan secara instan
            displayMessages();
        });

        // Tampilkan pesan pertama kali saat web dibuka
        displayMessages();
    </script>
</body>
</html>
