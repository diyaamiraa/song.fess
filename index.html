<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songfess Hub ✨</title>
    <!-- Menggunakan Tailwind CSS untuk mempermudah styling -->
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
        }
        /* Custom scrollbar tipis agar estetik */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-white font-sans antialiased pb-20">

    <!-- Header / Title Section -->
    <header class="text-center pt-12 pb-8">
        <h1 class="text-4xl font-bold flex items-center justify-center gap-3 tracking-wide">
            🎵 Songfess Hub
        </h1>
        <p class="text-gray-400 text-sm mt-3 tracking-wide">
            Kirim lagu dan pesan rahasiamu secara anonim. Semua orang bisa melihat.
        </p>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4">
        
        <!-- Box Form Kirim Songfess Baru (Sesuai Gambar) -->
        <section class="border border-gray-800 bg-[#050505] rounded-xl p-8 mb-12 shadow-2xl">
            <h2 class="text-xl font-bold mb-6 tracking-wide">Kirim Songfess Baru</h2>
            
            <form id="songfessForm" class="space-y-6">
                <!-- Tambahan Input From & To Opsional untuk memenuhi format request awal -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">Dari (From) - *boleh anonim</label>
                        <input type="text" id="fromInput" placeholder="Contoh: Secret Admirer" 
                            class="w-full bg-black border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-gray-300 focus:outline-none focus:border-gray-600 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">Untuk (To)</label>
                        <input type="text" id="toInput" required placeholder="Contoh: Dia yang di kelas sebelah" 
                            class="w-full bg-black border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-gray-300 focus:outline-none focus:border-gray-600 transition">
                    </div>
                </div>

                <!-- Input Judul Lagu (Sesuai Gambar) -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Judul Lagu & Penyanyi</label>
                    <input type="text" id="songInput" required placeholder="Contoh: Hindia - Evaluasi" 
                        class="w-full bg-black border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-gray-300 focus:outline-none focus:border-gray-600 transition">
                </div>

                <!-- Input Pesan (Sesuai Gambar) -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Pesan Anonim Kamu</label>
                    <textarea id="messageInput" required rows="4" placeholder="Tulis pesanmu di sini untuk seseorang..." 
                        class="w-full bg-black border border-gray-800 rounded-lg px-4 py-3 text-sm text-gray-300 focus:outline-none focus:border-gray-600 transition resize-none"></textarea>
                </div>

                <!-- Tombol Kirim Kuning (Sesuai Gambar) -->
                <div class="text-center pt-2">
                    <button type="submit" 
                        class="text-[#ffdf65] hover:text-[#ffe893] font-bold text-sm tracking-wide transition duration-200 flex items-center justify-center gap-1.5 mx-auto">
                        Kirim ke Beranda 🪄
                    </button>
                </div>
            </form>
        </section>

        <!-- Bagian Beranda Songfess (Sesuai Gambar) -->
        <section>
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2 tracking-wide">
                <span class="text-gray-500 font-light">|</span> Beranda Songfess
            </h2>

            <!-- Wadah tempat pesan-pesan muncul -->
            <div id="berandaPesan" class="space-y-4">
                <!-- Default state seperti di gambar ketika belum ada pesan -->
            </div>
        </section>

    </main>

    <script>
        const form = document.getElementById('songfessForm');
        const berandaPesan = document.getElementById('berandaPesan');

        // Mengambil data dari localStorage browser
        function getMessages() {
            const messages = localStorage.getItem('songfess_hub_data');
            return messages ? JSON.parse(messages) : [];
        }

        // Merender tampilan beranda secara real-time
        function renderMessages() {
            const messages = getMessages();
            berandaPesan.innerHTML = '';

            // Jika kosong, tampilkan box putus-putus seperti di gambar kamu
            if (messages.length === 0) {
                berandaPesan.innerHTML = `
                    <div class="border border-dashed border-gray-800 rounded-lg py-12 text-center text-gray-400 text-sm tracking-wide bg-[#020202]">
                        Belum ada pesan songfess saat ini. Jadilah yang pertama mengirim!
                    </div>
                `;
                return;
            }

            // Urutkan pesan dari yang paling baru di bagian atas
            messages.slice().reverse().forEach(data => {
                const bubble = document.createElement('div');
                bubble.className = "border border-gray-800 bg-[#090909] rounded-xl p-6 shadow-md transition duration-200 hover:border-gray-700 relative overflow-hidden";
                
                bubble.innerHTML = `
                    <!-- Tag Metadata Atas -->
                    <div class="flex flex-wrap gap-2 text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-3">
                        <span class="bg-gray-900 border border-gray-800 px-2 py-0.5 rounded">From: ${escapeHTML(data.from)}</span>
                        <span class="bg-gray-900 border border-gray-800 px-2 py-0.5 rounded text-indigo-400">To: ${escapeHTML(data.to)}</span>
                    </div>

                    <!-- Detail Info Lagu -->
                    <div class="flex items-center gap-2 text-sm font-medium text-[#ffdf65] mb-3">
                        <span>🎧</span>
                        <span>${escapeHTML(data.song)}</span>
                    </div>

                    <!-- Teks Pesan Utama -->
                    <p class="text-gray-300 text-sm leading-relaxed whitespace-pre-line bg-black/40 p-3 rounded-lg border border-gray-900/60">${escapeHTML(data.message)}</p>
                    
                    <!-- Informasi Waktu & Anonim -->
                    <div class="text-[10px] text-gray-500 mt-4 flex justify-between items-center border-t border-gray-900 pt-2">
                        <span>🔒 Diposting secara anonim</span>
                        <span>${data.time}</span>
                    </div>
                `;
                berandaPesan.appendChild(bubble);
            });
        }

        // Proses submit form tanpa reload
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const from = document.getElementById('fromInput').value.trim() || 'Anonymous';
            const to = document.getElementById('toInput').value.trim();
            const song = document.getElementById('songInput').value.trim();
            const message = document.getElementById('messageInput').value.trim();
            
            // Generate format waktu lokal
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' • ' + now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

            const newMessage = { from, to, song, message, time: timeString };

            const currentMessages = getMessages();
            currentMessages.push(newMessage);
            localStorage.setItem('songfess_hub_data', JSON.stringify(currentMessages));

            form.reset();
            renderMessages(); // Segera perbarui tampilan beranda setelah kirim
        });

        // Anti XSS injection protection
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Render otomatis saat halaman pertama kali dimuat
        renderMessages();
    </script>
</body>
</html>
