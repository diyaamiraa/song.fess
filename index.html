<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Fess - Kirim Lagu & Pesan Anonim</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #1db954, #1ed760);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin-top: 5px;
        }

        .fess-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1db954;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, 
        .input-group textarea {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: #1db954;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.2);
        }

        .btn-submit {
            background: #1db954;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }

        .btn-submit:hover {
            background: #1ed760;
            transform: translateY(-2px);
        }

        /* STRUKTUR BERANDA / TIMELINE BUBBLE */
        .timeline-container {
            width: 100%;
            max-width: 550px;
        }

        .timeline-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #1db954;
            border-bottom: 2px solid rgba(29, 185, 84, 0.3);
            padding-bottom: 10px;
        }

        .message-wall {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bubble {
            background: rgba(255, 255, 255, 0.08);
            border-left: 5px solid #1db954;
            padding: 20px;
            border-radius: 0 15px 15px 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }

        .bubble-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #1db954;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .bubble-song {
            background: rgba(29, 185, 84, 0.15);
            color: #1ed760;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .bubble-text {
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.5;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. BAGIAN FORM KIRIM PESAN -->
    <div class="container">
        <div class="header">
            <h1>🎵 Song Fess</h1>
            <p>Sampaikan perasaanmu lewat lagu secara rahasia.</p>
        </div>

        <form id="songfessForm" class="fess-form">
            <div class="input-group">
                <label for="from">From (Pengirim)</label>
                <input type="text" id="from" placeholder="Contoh: Anonim / Rahasia" required>
            </div>

            <div class="input-group">
                <label for="to">To (Untuk Siapa)</label>
                <input type="text" id="to" placeholder="Nama si dia..." required>
            </div>

            <div class="input-group">
                <label for="song">Song (Lagu & Penyanyi)</label>
                <input type="text" id="song" placeholder="Contoh: Hindia - Evaluasi" required>
            </div>

            <div class="input-group">
                <label for="message">Message (Pesan)</label>
                <textarea id="message" rows="4" placeholder="Tuliskan semua perasaanmu di sini..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">🚀 Send the Song</button>
        </form>
    </div>

    <!-- 2. BAGIAN BERANDA / TIMELINE UTK BACA PESAN -->
    <div class="timeline-container">
        <h2 class="timeline-title">📩 Beranda Menfess Terkini</h2>
        <div id="messageWall" class="message-wall">
            <!-- Bubble pesan orang-orang akan otomatis muncul di sini -->
        </div>
    </div>

    <!-- KODE JAVASCRIPT UNTUK SIMULASI MENYIMPAN DAN MENAMPILKAN PESAN -->
    <script>
        const form = document.getElementById('songfessForm');
        const messageWall = document.getElementById('messageWall');

        // Fungsi menampilkan pesan ke layar
        function displayMessages() {
            messageWall.innerHTML = '';
            // Mengambil data pesan yang tersimpan di browser
            const messages = JSON.parse(localStorage.getItem('songfess_data')) || [];
            
            if(messages.length === 0) {
                messageWall.innerHTML = '<p style="text-align:center; color:#666;">Belum ada pesan dikirim. Jadilah yang pertama!</p>';
                return;
            }

            // Tampilkan pesan paling baru di atas
            messages.reverse().forEach(data => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerHTML = `
                    <div class="bubble-meta">
                        <span>Dari: ${escapeHTML(data.from)}</span>
                        <span>Untuk: ${escapeHTML(data.to)}</span>
                    </div>
                    <div class="bubble-song">🎵 ${escapeHTML(data.song)}</div>
                    <p class="bubble-text">${escapeHTML(data.message)}</p>
                `;
                messageWall.appendChild(bubble);
            });
        }

        // Fungsi mengamankan teks dari hacker/script jahat (XSS)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Event saat tombol "Send the Song" ditekan
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const fromVal = document.getElementById('from').value;
            const toVal = document.getElementById('to').value;
            const songVal = document.getElementById('song').value;
            const messageVal = document.getElementById('message').value;

            const newMessage = {
                from: fromVal,
                to: toVal,
                song: songVal,
                message: messageVal
            };

            // Simpan ke LocalStorage browser
            const currentMessages = JSON.parse(localStorage.getItem('songfess_data')) || [];
            currentMessages.push(newMessage);
            localStorage.setItem('songfess_data', JSON.stringify(currentMessages));

            // Reset form input setelah kirim
            form.reset();

            // Refresh halaman beranda bubble chat
            displayMessages();
            
            alert('Pesan Song Fess berhasil dikirim ke Beranda!');
        });

        // Jalankan fungsi saat web pertama kali dibuka
        displayMessages();
    </script>

</body>
</html>
